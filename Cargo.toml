[package]
name = "quat_security"
version = "1.1.0"
edition = "2021"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "A lightweight behavioral security engine and anomaly detector in pure Rust using a 4-state biological model."
readme = "README.md"
license = "AGPL-3.0-only"
repository = "https://github.com/strahinjastojanovic826-code/quat_security"
keywords = ["security", "procfs", "system-monitoring", "defense"]
categories = ["command-line-utilities", "os"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cbindgen = "0.26"